# ClaimGate project-local Codex configuration.
model = "gpt-5.6-sol"
sandbox_mode = "danger-full-access"
approval_policy = "on-request"

[sandbox_workspace_write]
writable_roots = ["."]
network_access = true

[shell_environment_policy]
inherit = "core"
exclude = ["AWS_*", "GCP_*", "AZURE_*", "OPENAI_API_KEY", "ANTHROPIC_API_KEY", "*_TOKEN", "*_SECRET", "*_PASSWORD"]

[[hooks.Stop]]
[[hooks.Stop.hooks]]
type = "command"
command = 'bash "$(git rev-parse --show-toplevel)/.codex/hooks/stop.sh"'
timeout = 5
statusMessage = "ClaimGate close check"

[[hooks.PostToolUse]]
matcher = "apply_patch|Edit|Write|MultiEdit"
[[hooks.PostToolUse.hooks]]
type = "command"
command = 'bash "$(git rev-parse --show-toplevel)/.codex/hooks/post-edit-validate.sh"'
timeout = 30
statusMessage = "ClaimGate post-edit validation"

[[hooks.PreToolUse]]
matcher = "Bash"
[[hooks.PreToolUse.hooks]]
type = "command"
command = 'bash "$(git rev-parse --show-toplevel)/.codex/hooks/pretooluse-guard.sh"'
timeout = 5
statusMessage = "command guard"

[agents]
max_threads = 6
max_depth = 1

[mcp_servers.codex]
command = "codex"
args = ["mcp-server"]
startup_timeout_sec = 10
tool_timeout_sec = 60

[harness]
manifest = "AGENTS.md"
language = "typescript"
build_system = "pnpm"
commands = { install = "pnpm install", build = "pnpm build", test = "pnpm test", lint = "pnpm lint", typecheck = "pnpm typecheck", demo = "pnpm demo" }
