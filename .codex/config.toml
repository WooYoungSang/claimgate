# .codex/config.toml — generated by devos_harness_install (Ignis Harness Registry)
# Project-scoped Codex configuration. Do not hand-edit.
# Update via: devos_harness_propagate. This follows the official Codex
# split: AGENTS.md for durable repo guidance, .agents/skills for workflows,
# .codex/agents for custom subagents, and hooks configured below.

# Official Codex config keys. See: https://developers.openai.com/codex/config-reference
# NOTE: `model_provider` is user-level-only — emitting it at project scope
# triggers "⚠ Ignored unsupported project-local config keys" in Codex CLI.
# Set provider in ~/.codex/config.toml instead. We keep `model` since
# that IS honored at project scope.
model = "gpt-5.5"
sandbox_mode = "danger-full-access"

# Hook-parity with Claude Code's .claude/settings.json. Codex CLI project
# hooks use the official 3-level shape:
#   [[hooks.Event]] -> matcher group -> [[hooks.Event.hooks]] command handler.
# Notes:
#   - approval_policy = "on-request"  → human approval for risky tool calls
#   - [sandbox_workspace_write]       → official project sandbox keys only
#   - [shell_environment_policy]      → scrubs secret env vars
#   - [hooks].Stop                    → vault-os SSOT re-check reminder
#   - [hooks].PostToolUse (apply_patch|Edit|Write|MultiEdit) → ruff/pytest
#   - [hooks].PreToolUse (Bash)       → destructive-command guard
# The `notify` key is intentionally OMITTED — Codex CLI treats it as a
# user-level-only setting and warns when emitted at project scope.

approval_policy = "on-request"

# Default install policy is workspace-write. Use danger-full-access only for
# isolated worktree automation after explicit operator acknowledgement.
# Project-local Codex config is ignored until the project is trusted in
# ~/.codex/config.toml, e.g.:
# [projects."/absolute/project/path"]
# trust_level = "trusted"

[sandbox_workspace_write]
writable_roots = ["."]
network_access = true

[shell_environment_policy]
inherit = "core"
exclude = [
  "AWS_*",
  "GCP_*",
  "AZURE_*",
  "OPENAI_API_KEY",
  "ANTHROPIC_API_KEY",
  "*_TOKEN",
  "*_SECRET",
  "*_PASSWORD",
]

# Hooks (Codex CLI supports SessionStart, PreToolUse, PermissionRequest,
# PostToolUse, UserPromptSubmit, Stop, PreCompact/PostCompact, and
# SubagentStart/SubagentStop — see Codex CLI hooks reference).
# Project hooks only run when the project is trusted. Commands resolve from
# the repo root explicitly because hooks may execute from variable cwd.
[[hooks.Stop]]
[[hooks.Stop.hooks]]
type = "command"
command = 'bash "$(git rev-parse --show-toplevel)/.codex/hooks/stop.sh"'
timeout = 5
statusMessage = "ShapeOps close reminder"

[[hooks.PostToolUse]]
matcher = "apply_patch|Edit|Write|MultiEdit"
[[hooks.PostToolUse.hooks]]
type = "command"
command = 'bash "$(git rev-parse --show-toplevel)/.codex/hooks/post-edit-validate.sh"'
timeout = 30
statusMessage = "Scoped post-edit validation"

[[hooks.PreToolUse]]
matcher = "Bash"
[[hooks.PreToolUse.hooks]]
type = "command"
command = 'bash "$(git rev-parse --show-toplevel)/.codex/hooks/pretooluse-guard.sh"'
timeout = 5
statusMessage = "Destructive-command guard"

[agents]
max_threads = 6
max_depth = 1

[mcp_servers.warvis-mcp]
url = "http://localhost:45112/mcp"
startup_timeout_sec = 10
tool_timeout_sec = 60

[mcp_servers.codex]
command = "codex"
args = ["mcp-server"]
startup_timeout_sec = 10
tool_timeout_sec = 60

# Harness metadata (non-Codex keys, namespaced to avoid config-key ambiguity).
[harness]
manifest = "AGENTS.md"
language = "typescript"
build_system = "pnpm"
agent_count = 70
agent_names = ["analyst", "architect", "code-reviewer", "critic", "ctrl-tower-codex-dispatcher", "ctrl-tower-wave-ratifier", "designer", "document-specialist", "executor", "explore", "patch-writer", "planner", "python-generic-engineer", "verifier", "writer", "api-engineer-write", "api-engineer", "cache-engineer", "collab-engineer", "dev-session-engineer", "final-integration-verifier", "graphrag-engineer", "graphrag-perf-analyst", "graphrag-specialist", "impl-evaluator", "infra-architect", "infra-engineer", "jenkins-deployment-engineer", "langchain-mcp-engineer", "mcp-surface-engineer", "platform-engineer", "python-domain-engineer", "qa-tester", "release-engineer", "reporting-analyst", "safety-engineer", "saga-engineer", "security-reviewer", "shared-infra-contract-keeper", "test-engineer", "adr-author", "bet-advancer", "bet-author", "bet-kill-keeper", "bet-ratifier", "canonical-domain-mapper", "continuity-architect", "contract-reviewer", "cooldown-keeper", "dashboard-renderer", "dev-session-runner", "evidence-persistence-engineer", "fr-author", "governance-validator", "handoff-coordinator", "lesson-preparer", "lifecycle-architect", "nfr-author", "obsidian-adapter-engineer", "pitch-author", "scope-author", "session-archivist", "shapeops-gate-progressor", "slug-minter-guardian", "uow-author", "warvis-finisher", "warvis-initiator", "warvis-maker", "warvis-planner", "warvis-verifier"]

[harness.scan_exclusions]
# Scan-budget deny policy — symmetric to .claude/settings.json permissions.deny.
# Dependency/generated/cache/log/lock paths kept out of full-repo scanning
# to preserve the Codex scan budget. Single source of truth:
# context_devos.harness.registry.templates.scan_exclusion_globs().
read_excluded_globs = [
  "**/node_modules/**",
  "**/.venv/**",
  "**/venv/**",
  "**/__pycache__/**",
  "**/dist/**",
  "**/build/**",
  "**/target/**",
  "**/out/**",
  "**/coverage/**",
  "**/logs/**",
  "**/.git/**",
  "**/*.log",
  "**/*.parquet",
  "**/*.sqlite",
  "**/*.db",
  "**/package-lock.json",
  "**/yarn.lock",
  "**/pnpm-lock.yaml",
  "**/poetry.lock",
]

[harness.claimgate]
project_id = "warvis-claimgate"
shapeops_project = "warvis-claimgate-framework"
roadmap = ".omc/plan/forge-bet-roadmap.md"
forge_unit = "bet"
default_implementer = "codex"
parallel_strategy = "one-bet-per-worktree-session; dependency barriers enforced by main coordinator"
commands = { install = "pnpm install", build = "pnpm build", test = "pnpm test", lint = "pnpm lint", typecheck = "pnpm typecheck", demo = "pnpm demo" }
